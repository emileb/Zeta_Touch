apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    ndkVersion '27.3.13750724'
    namespace 'com.opentouchgaming.razetouch'

    compileSdk {
        version = release(35)
    }

    defaultConfig {
        applicationId "com.opentouchgaming.razetouch"
        minSdkVersion 21
        targetSdkVersion 35 // Needs 'All files access' (MANAGE_EXTERNAL_STORAGE) for full native filesystem access on Android 11+
        versionCode 36
        versionName "4.0"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets.main {
        jniLibs.srcDir 'src/main/libs'
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android_dummy.mk')
        }
    }

    // Add this block and enable/disable the parameters as follows
    bundle {

        density {
            // Different APKs are generated for devices with different screen densities; true by default.
            enableSplit false
        }
        abi {
            // Different APKs are generated for devices with different CPU architectures; true by default.
            enableSplit true
        }
        language {
            // This is disabled so that the App Bundle does NOT split the APK for each language.
            // We're gonna use the same APK for all languages.
            enableSplit false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation project(path: ':androidcore')
    implementation project(path: ':saffal')

    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'androidx.appcompat:appcompat:1.6.1'  // 1.6.1 is maximum for API 19
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0' //4.16.0 Needed to launch on Nvidia Shield (5.x fails)
    implementation 'com.github.bumptech.glide:glide:4.16.0'         //4.16.0 Needed to launch on Nvidia Shield (5.x fails)
    implementation("com.michael-bull.kotlin-result:kotlin-result:1.1.8")
    implementation 'com.google.code.gson:gson:2.13.2'

    implementation 'androidx.core:core-ktx:1.8.0'
    annotationProcessor 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2' // Needed for API 19
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
